name: iios checkin

on:
  workflow_dispatch:        # 先只手动触发，跑通再加 schedule
  # schedule:
  #   - cron: '0 1 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run checkin
        env:
          IIOS_USERNAME: ${{ secrets.IIOS_USERNAME }}
          IIOS_PASSWORD: ${{ secrets.IIOS_PASSWORD }}
        run: python checkin.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
